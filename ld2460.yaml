substitutions:
  # Defaults to this checkout. Override with a published github:// source when
  # using the package remotely; the new tracking options need matching code.
  ld2460_external_components_source: components
  ld2460_bus_id: ld2460_bus
  ld2460_component_id: ld2460_radar
  ld2460_tx_pin: GPIO16
  ld2460_rx_pin: GPIO17
  ld2460_publish_interval: 5s

external_components:
  - source: ${ld2460_external_components_source}
    components: [ld2460]
    refresh: 1d

uart:
  - id: ${ld2460_bus_id}
    tx_pin: ${ld2460_tx_pin}
    rx_pin: ${ld2460_rx_pin}
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024

ld2460:
  id: ${ld2460_component_id}
  uart_id: ${ld2460_bus_id}
  baud_scan: false
  flush_timeout: 100ms
  max_buffer_size: 48
  no_data_log_interval: 10s
  publish_interval: ${ld2460_publish_interval}
  presence_timeout: 20s
  stationary_presence_timeout: 60min
  stationary_dwell: 10s
  exit_timeout: 5s
  edge_margin: 0.5
  radar_health_timeout: 90s
  presence:
    name: "Presence"
  target_count:
    name: "Target Count"
  radar_available:
    name: "Radar Available"
  reporting:
    name: "Radar Reporting"
    entity_category: diagnostic
    disabled_by_default: true
    restore_mode: RESTORE_DEFAULT_ON
  tracking:
    zone_enabled:
      name: "Room Tracking Zone"
      initial_state: false
    point_1_x:
      name: "Room Point 1 X"
    point_1_y:
      name: "Room Point 1 Y"
    point_2_x:
      name: "Room Point 2 X"
    point_2_y:
      name: "Room Point 2 Y"
    point_3_x:
      name: "Room Point 3 X"
    point_3_y:
      name: "Room Point 3 Y"
    point_4_x:
      name: "Room Point 4 X"
    point_4_y:
      name: "Room Point 4 Y"
    exit_edge_1:
      name: "Room Exit Edge 1"
    exit_edge_2:
      name: "Room Exit Edge 2"
    presence_timeout:
      name: "Presence Hold"
    stationary_presence_timeout:
      name: "Stationary Presence Hold"
    stationary_dwell:
      name: "Stationary Qualification Time"
    exit_timeout:
      name: "Exit Hold"
    edge_margin:
      name: "Exit Edge Margin"
  firmware:
    name: "Radar Firmware"
  installation_mode:
    name: "Installation Mode"
  installation_mode_select:
    name: "Installation Mode Setting"
  installation_height:
    name: "Installation Height"
  installation_angle:
    name: "Installation Angle"
  detection_distance:
    name: "Detection Distance"
  start_angle:
    name: "Detection Start Angle"
  end_angle:
    name: "Detection End Angle"
