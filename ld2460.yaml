substitutions:
  name: "ld2460-bedroom-jonas"
  friendly_name: "LD2460 Bedroom Jonas"
  scd41_temperature_offset: 20
  sda_pin: "GPIO06"
  scl_pin: "GPIO07"
  illuminance_update_interval: "10s"
  ld2460_package_version: v0.1.1
  ld2460_bus_id: ld2460_bus
  ld2460_component_id: ld2460_radar
  ld2460_tx_pin: GPIO16
  ld2460_rx_pin: GPIO17
  ld2460_publish_interval: 500ms

esphome:
  name: ${name}
  comment: ${friendly_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True

esp32:
  board: adafruit_feather_esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_DETECT: y
      COMPILER_OPTIMIZATION_SIZE: y
      
network:
  enable_ipv6: False

logger:

api:
  encryption:
    key: "9ZLK+r+6+yhvU9oxq6sBRphJQVfHLj+wianJMrjUxMs="

ota:
  - platform: esphome
    password: "cbda70ba357fc01a8a1c49c238993815"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.3.15

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Etest Fallback Hotspot"
    password: "EuP4LBfkJCVD"

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    entity_category: config
  - platform: factory_reset
    id: "factory_reset_button"
    internal: True

uart:
  id: ${ld2460_bus_id}
  tx_pin: ${ld2460_tx_pin}
  rx_pin: ${ld2460_rx_pin}
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

i2c:
  - id: i2c_bus
    sda: ${sda_pin}
    scl: ${scl_pin}



external_components:
  - source:
      type: local
      path: components
    components: [ld2460]

uart:
  - id: ${ld2460_bus_id}
    tx_pin: ${ld2460_tx_pin}
    rx_pin: ${ld2460_rx_pin}
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 1024

ld2460:
  id: ${ld2460_component_id}
  uart_id: ${ld2460_bus_id}
  baud_scan: false
  flush_timeout: 100ms
  max_buffer_size: 48
  no_data_log_interval: 10s
  publish_interval: ${ld2460_publish_interval}
  presence:
    name: "Presence"
  target_count:
    name: "Target Count"
  reporting:
    name: "Reporting"
    restore_mode: RESTORE_DEFAULT_ON
  firmware:
    name: "Radar Firmware"
  installation_mode:
    name: "Installation Mode"
  installation_mode_select:
    name: "Installation Mode Setting"
  sensitivity:
    name: "Radar Sensitivity"
  installation_height:
    name: "Installation Height"
  installation_angle:
    name: "Installation Angle"
  detection_distance:
    name: "Detection Distance"
  start_angle:
    name: "Detection Start Angle"
  end_angle:
    name: "Detection End Angle"
  target_1:
    x:
      name: "Target 1 X"
    y:
      name: "Target 1 Y"
    distance:
      name: "Target 1 Distance"
    angle:
      name: "Target 1 Angle"
  target_2:
    x:
      name: "Target 2 X"
    y:
      name: "Target 2 Y"
    distance:
      name: "Target 2 Distance"
    angle:
      name: "Target 2 Angle"
  target_3:
    x:
      name: "Target 3 X"
    y:
      name: "Target 3 Y"
    distance:
      name: "Target 3 Distance"
    angle:
      name: "Target 3 Angle"
  target_4:
    x:
      name: "Target 4 X"
    y:
      name: "Target 4 Y"
    distance:
      name: "Target 4 Distance"
    angle:
      name: "Target 4 Angle"
  target_5:
    x:
      name: "Target 5 X"
    y:
      name: "Target 5 Y"
    distance:
      name: "Target 5 Distance"
    angle:
      name: "Target 5 Angle"


packages:
  bh1750: !include common/bh1750.yaml
  co2: !include common/co2.yaml
  bluetooth_base: !include common/bluetooth.yaml